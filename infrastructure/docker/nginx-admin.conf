# infrastructure/docker/nginx-admin.conf
# Serve SPA admin tĩnh, fallback về index.html cho client-side routing.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip nén
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers cơ bản (Cloudflare cũng thêm ở edge, nhưng defense-in-depth)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets lâu (hashed filenames từ Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: mọi route không khớp file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
