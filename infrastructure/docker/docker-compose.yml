# infrastructure/docker/docker-compose.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sourceban
    ports: ["5432:5432"]
  adminer:
    image: adminer
    ports: ["8080:8080"]
    depends_on: [postgres]
  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: "devMasterKey123!"
      MEILI_ENV: "development"
    ports: ["7700:7700"]
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

volumes:
  meili_data: