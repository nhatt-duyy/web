# ============================================================================
# infrastructure/docker/nginx.conf — Reverse proxy cho production stack
# Chạy trong container nginx:alpine, expose 80/443.
# Route:
#   /         → web (Next.js standalone, container "web")
#   /admin    → admin (SPA tĩnh, container "admin")
#   /api      → api (NestJS, container "api")
#
# SSL: Cloudflare Origin Certificate (Full Strict). Lưu file:
#   /etc/nginx/ssl/origin.crt  và  /etc/nginx/ssl/origin.key
# (được mount từ host volume khi chạy docker compose).
# ============================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Upstreams
    upstream web_upstream {
        server web:3000;
    }
    upstream admin_upstream {
        server admin:80;
    }
    upstream api_upstream {
        server api:3001;
    }

    # ---- HTTPS server (Cloudflare Origin Cert) ----
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/origin.crt;
        ssl_certificate_key /etc/nginx/ssl/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # HSTS (chỉ bật khi đã chắc chắn HTTPS hoạt động)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API
        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Admin SPA
        location /admin/ {
            proxy_pass http://admin_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Web (Next.js)
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ---- HTTP → HTTPS redirect ----
    server {
        listen 80;
        server_name _;
        # ACME challenge (nếu dùng Let's Encrypt thay vì Cloudflare Origin Cert)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }
}
